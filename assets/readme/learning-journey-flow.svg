<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="100%" height="230">
  <defs>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B6E84" />
      <stop offset="35%" stop-color="#2A9D8F" />
      <stop offset="70%" stop-color="#E76F51" />
      <stop offset="100%" stop-color="#F4A261" />
    </linearGradient>
    <style>
      .card-title { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 16px; fill: #14212B; }
      .card-kiny { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 12px; fill: #0B6E84; }
      .card-desc { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; font-weight: 500; font-size: 12px; fill: #5C6B76; }
      .step-num { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 13px; fill: #FFFFFF; }
      .pulse-dot { animation: movePulse 4.5s ease-in-out infinite; }
      .stage-1 { animation: stageGlow 4.5s infinite 0s; }
      .stage-2 { animation: stageGlow 4.5s infinite 1.1s; }
      .stage-3 { animation: stageGlow 4.5s infinite 2.2s; }
      .stage-4 { animation: stageGlow 4.5s infinite 3.3s; }
      @keyframes movePulse {
        0% { transform: translateX(0px); opacity: 1; }
        90% { transform: translateX(720px); opacity: 1; }
        100% { transform: translateX(720px); opacity: 0; }
      }
      @keyframes stageGlow {
        0%, 100% { transform: translateY(0px); }
        15% { transform: translateY(-5px); }
        30% { transform: translateY(0px); }
      }
    </style>
  </defs>

  <rect width="960" height="230" rx="20" fill="#F4F9FB" stroke="#D5E5EC" stroke-width="1.5" />

  <!-- Connecting Progress Track -->
  <line x1="120" y1="54" x2="840" y2="54" stroke="#DCE9EE" stroke-width="6" stroke-linecap="round" />
  <line x1="120" y1="54" x2="840" y2="54" stroke="url(#trackGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="720" stroke-dashoffset="0" opacity="0.65" />

  <!-- Animated Traveling Pulse Orb -->
  <g class="pulse-dot">
    <circle cx="120" cy="54" r="10" fill="#0B6E84" opacity="0.28" />
    <circle cx="120" cy="54" r="5" fill="#0B6E84" />
  </g>

  <!-- Stage 1: Learn -->
  <g class="stage-1" transform="translate(24, 24)">
    <rect x="0" y="48" width="210" height="134" rx="16" fill="#FFFFFF" stroke="#0B6E84" stroke-width="2" />
    <circle cx="96" cy="30" r="20" fill="#0B6E84" />
    <text x="96" y="35" class="step-num" text-anchor="middle">1</text>
    <text x="20" y="82" class="card-kiny">INTAMBWE YA 1 · KWIGA</text>
    <text x="20" y="106" class="card-title">📖 Guided Learn</text>
    <text x="20" y="130" class="card-desc">Interactive phrase cards,</text>
    <text x="20" y="148" class="card-desc">native pronunciation tips</text>
    <text x="20" y="166" class="card-desc">&amp; cultural context notes.</text>
  </g>

  <!-- Stage 2: Practice -->
  <g class="stage-2" transform="translate(258, 24)">
    <rect x="0" y="48" width="210" height="134" rx="16" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2" />
    <circle cx="105" cy="30" r="20" fill="#2A9D8F" />
    <text x="105" y="35" class="step-num" text-anchor="middle">2</text>
    <text x="20" y="82" class="card-kiny" fill="#2A9D8F">INTAMBWE YA 2 · KWITOZA</text>
    <text x="20" y="106" class="card-title">🎯 Guided Practice</text>
    <text x="20" y="130" class="card-desc">Low-stakes recognition,</text>
    <text x="20" y="148" class="card-desc">fill-in-the-blank &amp; tactile</text>
    <text x="20" y="166" class="card-desc">spring-animated feedback.</text>
  </g>

  <!-- Stage 3: Reinforce -->
  <g class="stage-3" transform="translate(492, 24)">
    <rect x="0" y="48" width="210" height="134" rx="16" fill="#FFFFFF" stroke="#E76F51" stroke-width="2" />
    <circle cx="105" cy="30" r="20" fill="#E76F51" />
    <text x="105" y="35" class="step-num" text-anchor="middle">3</text>
    <text x="20" y="82" class="card-kiny" fill="#E76F51">INTAMBWE YA 3 · GUSHIMANGIRA</text>
    <text x="20" y="106" class="card-title">🧩 Active Reinforce</text>
    <text x="20" y="130" class="card-desc">Sentence building tiles,</text>
    <text x="20" y="148" class="card-desc">word-pair matching &amp;</text>
    <text x="20" y="166" class="card-desc">dynamic question pools.</text>
  </g>

  <!-- Stage 4: Assessment -->
  <g class="stage-4" transform="translate(726, 24)">
    <rect x="0" y="48" width="210" height="134" rx="16" fill="#FFFFFF" stroke="#F4A261" stroke-width="2" />
    <circle cx="114" cy="30" r="20" fill="#F4A261" />
    <text x="114" y="35" class="step-num" text-anchor="middle">4</text>
    <text x="20" y="82" class="card-kiny" fill="#D97706">INTAMBWE YA 4 · ISUZUMA</text>
    <text x="20" y="106" class="card-title">🏆 Assessment</text>
    <text x="20" y="130" class="card-desc">Mastery check unlocking</text>
    <text x="20" y="148" class="card-desc">next unit node, XP bonus</text>
    <text x="20" y="166" class="card-desc">&amp; streak multipliers.</text>
  </g>
</svg>
